<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
/* ------------------------------------------------------------------ base */
:root{
  --accent:#1a56db;--ink:#16181d;--mut:#5d6470;--line:#e3e6ea;--bg:#f6f7f9;--card:#fff;
  --p0:#7f1d1d;--p1:#dc2626;--p2:#d97706;--p3:#6b7280;--ok:#2f855a;
  --side:252px;--top:60px;--r:12px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em}
h2{font-size:22px;letter-spacing:-.01em}h3{font-size:16px}
p{margin:0 0 .8em}
code{font:12.5px var(--mono);background:#eef1f5;padding:1px 5px;border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--accent);color:var(--ink);background:#f7f9fc;border-radius:0 8px 8px 0}
.mut{color:var(--mut)}.small{font-size:13px}.nowrap{white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:0 0 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid transparent;line-height:1.5;vertical-align:middle}
.sev-P0{background:var(--p0);color:#fff;border-color:var(--p0)}.sev-P1{background:#fee2e2;color:#b91c1c;border-color:#fca5a5}
.sev-P2{background:#fef3c7;color:#92400e;border-color:#fcd34d}.sev-P3{background:#f3f4f6;color:#4b5563;border-color:#e5e7eb}
.chip .code{font-weight:600;opacity:.7;margin-left:2px}
.cat{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border:1px solid color-mix(in srgb,var(--c) 30%,#fff)}
.cat .sub{font-weight:500;opacity:.85}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:#eef1f5;color:var(--mut);margin:0 4px 4px 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--ink)}
.btn:hover{border-color:#c9ced6;background:#fafbfc;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:4px 9px;font-size:12.5px}
.kicker{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:0 0 6px}
.hide{display:none!important}
.shot{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in}
.thumb{width:132px;aspect-ratio:16/10;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:zoom-in;display:inline-block;margin:4px 6px 4px 0;vertical-align:top}
.score{font-weight:800;font-variant-numeric:tabular-nums}
.c0{color:var(--p0)}.c1{color:var(--p1)}.c2{color:var(--p2)}.c3{color:var(--ok)}

/* ------------------------------------------------------------------ shell */
.top{position:fixed;top:0;left:0;right:0;height:var(--top);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;z-index:20}
.top .logo{width:34px;height:34px;border-radius:9px;object-fit:contain;border:1px solid var(--line);background:#fff;padding:3px}
.top .name{font-weight:800;font-size:17px;letter-spacing:-.01em}
.top .sub{color:var(--mut);font-size:13px}
.top .sp{flex:1}
.top .overall{display:flex;align-items:baseline;gap:4px;padding:4px 12px;border-radius:999px;background:#f2f4f8;font-size:13px;color:var(--mut)}
.top .overall b{font-size:20px}
.side{position:fixed;top:var(--top);left:0;bottom:0;width:var(--side);background:#fff;border-right:1px solid var(--line);overflow:auto;padding:14px 10px;z-index:10}
.side a{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:8px;color:var(--ink);font-weight:600;font-size:14px}
.side a:hover{background:#f2f4f8;text-decoration:none}
.side a.on{background:var(--accent);color:#fff}
.side a .n{font-size:12px;color:var(--mut);font-weight:600;flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}.side a.on .n{color:#fff;opacity:.85}
.side a>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .kicker{padding:14px 12px 4px}
.side .grp{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:800;padding:16px 12px 4px}
.side .grp:first-child{padding-top:4px}
.side a.sub{padding:6px 12px 6px 22px;font-weight:500;font-size:13.5px}
.side a.subsub{padding:4px 12px 4px 40px;font-weight:500;font-size:12.5px;color:var(--mut)}
.side a .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;flex:none}
.side .lens{font-weight:500;font-size:13.5px}
.side .sc{display:inline-block;min-width:22px;text-align:right}
.side .bar{width:46px;height:5px;border-radius:3px;background:#e9ecf1;overflow:hidden;display:inline-block;margin-left:8px}
.side .bar i{display:block;height:100%}
.side a.on .bar{background:rgba(255,255,255,.3)}
.side a.on .n span{color:#fff!important}
main{margin:var(--top) 0 0 var(--side);padding:26px 30px 80px;max-width:1280px}
.view{display:none}.view.on{display:block}
.hero{display:flex;gap:20px;align-items:flex-start;margin-bottom:18px}
.hero .verdict{font-size:19px;line-height:1.45;font-weight:600;letter-spacing:-.005em}
.hero .verdict .kicker{margin-bottom:8px}
@media (max-width:900px){.side{display:none}main{margin-left:0;padding:18px 16px}}

/* ------------------------------------------------------------- rings */
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:0 0 18px}
.ring{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:center;cursor:pointer;transition:transform .12s,box-shadow .12s}
.ring:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,30,60,.08)}
.ring svg{width:82px;height:82px;display:block;margin:0 auto 6px}
.ring .lab{font-weight:700;font-size:13.5px}
.ring .n{font-size:12px;color:var(--mut)}
.ring.big svg{width:120px;height:120px}

/* ------------------------------------------------------------- top5 */
.t5{display:grid;gap:12px}
.t5 .row{display:grid;grid-template-columns:44px 84px 1fr 1fr 150px;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;align-items:start}
.t5 .row .num{font-size:26px;font-weight:800;color:#c9ced6;line-height:1}
.t5 .row .what{font-weight:600}
.t5 .row .cost{color:var(--mut)}
.t5 .row .eff{font-size:12.5px;color:var(--mut)}
.t5 .row .q{grid-column:3/-1;display:flex;gap:12px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}
.t5 .row .q .thumb{flex:none}
@media (max-width:900px){.t5 .row{grid-template-columns:36px 70px 1fr}.t5 .row .cost,.t5 .row .eff{grid-column:3}.t5 .row .q{grid-column:1/-1}}

/* ------------------------------------------------------------- findings */
.fx{display:grid;grid-template-columns:1fr;gap:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters .f{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--mut)}
.filters .f.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters .f.sevf.on.P0{background:var(--p0);border-color:var(--p0)}.filters .f.sevf.on.P1{background:var(--p1);border-color:var(--p1)}
.filters .f.sevf.on.P2{background:var(--p2);border-color:var(--p2)}.filters .f.sevf.on.P3{background:var(--p3);border-color:var(--p3)}
.filters input{border:1px solid var(--line);border-radius:9px;padding:6px 10px;font:inherit;min-width:220px}
.filters .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.flist{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.frow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.frow .lead{display:flex;flex-direction:column;gap:4px;align-items:flex-start;width:200px}
.frow .fix{font-size:13px;color:var(--mut);margin-top:2px}.frow .fix b{color:var(--ink);font-weight:600}
.frow .go{color:#b6bcc6;font-size:18px}
@media (max-width:760px){.frow .fix{display:none}.frow .lead{min-width:0}}
.catgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:1100px){.catgrid{grid-template-columns:repeat(3,1fr)}}@media (max-width:640px){.catgrid{grid-template-columns:repeat(2,1fr)}}
.ccard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:14px 12px;text-align:center;cursor:pointer}
.ccard:hover{box-shadow:0 6px 18px rgba(20,30,60,.08)}
.ccard svg{width:86px;height:86px;display:block;margin:0 auto 6px}
.ccard .lab{font-weight:800;font-size:14px}.ccard .q{font-size:12px;color:var(--mut);margin-top:2px}
.ccard .n{font-size:12px;color:var(--mut);margin-top:6px}
.t5r{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.t5r:last-child{border-bottom:0}.t5r:hover{background:#fafbfd}
.t5r .num{font-size:24px;font-weight:800;color:#c9ced6;line-height:1}
.t5r .ttl{font-weight:700;font-size:15.5px;margin:4px 0 2px}
.t5r .eff{font-size:12px;color:var(--mut);white-space:nowrap}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px;margin:8px 0}
.lim li{margin-bottom:8px}
.frow:last-child{border-bottom:0}.frow:hover{background:#fafbfd}.frow.on{background:#eef3ff}
.frow .t{font-weight:600}
.frow .m{font-size:12.5px;color:var(--mut)}
.frow .st{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef1f5;color:var(--mut)}
.st-accepted{background:#e6f4ec!important;color:var(--ok)!important}.st-rejected{background:#eef0f3!important;color:#7a8290!important;text-decoration:line-through}
.st-fixed{background:#e3ecff!important;color:var(--accent)!important}
.drawer{position:fixed;top:var(--top);right:0;bottom:0;width:min(640px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(20,30,60,.08);transform:translateX(102%);transition:transform .2s;z-index:15;overflow:auto;padding:22px 26px 60px}
.drawer.on{transform:none}
.drawer .close{position:absolute;top:12px;right:14px}
.drawer h2{font-size:19px;margin:8px 0 10px;padding-right:40px}
.drawer .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.drawer h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 0 6px}
.drawer ul{margin:0;padding-left:18px}
.drawer .triage{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.drawer .triage .opts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.drawer textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13.5px}

/* ------------------------------------------------------------- personas */
.pcard{display:grid;grid-template-columns:150px 1fr;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.pcard:hover{box-shadow:0 6px 18px rgba(20,30,60,.08)}
.pcard .shot{aspect-ratio:16/11;cursor:pointer}
.pcard h3{margin:0 0 4px}
.pcard .facts{font-size:13px;color:var(--mut)}
.ptabs{display:flex;gap:6px;margin:12px 0}
.ptabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--mut)}
.ptabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.replay{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
.replay .log{background:#fff;border:1px solid var(--line);border-radius:var(--r);max-height:70vh;overflow:auto}
.replay .log div{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer;display:grid;grid-template-columns:52px 1fr;gap:8px}
.replay .log div:hover{background:#fafbfd}.replay .log div.on{background:#eef3ff}
.replay .log .t{font:12px var(--mono);color:var(--mut);padding-top:2px}
.replay .stage{position:sticky;top:76px}
.replay .stage .shot{aspect-ratio:auto;max-height:70vh;object-fit:contain;object-position:top;cursor:zoom-in}
.replay .ctl{display:flex;gap:8px;align-items:center;margin:10px 0}
.replay .ctl input[type=range]{flex:1}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.strip figure{margin:0}.strip figcaption{font-size:12px;color:var(--mut);margin-top:4px;word-break:break-all}
@media (max-width:900px){.replay{grid-template-columns:1fr}.pcard{grid-template-columns:1fr}}

/* ------------------------------------------------------------- quotes */
.qt td.who{white-space:nowrap;font-weight:600}
.qt td.q{font-size:15px}

/* ------------------------------------------------------------- lightbox */
.lb{position:fixed;inset:0;background:rgba(10,12,18,.92);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:26px}
.lb.on{display:flex}
.lb img{max-width:96vw;max-height:84vh;border-radius:6px;background:#fff}
.lb .cap{color:#dfe3ea;font-size:13px;margin-top:10px;font-family:var(--mono)}
.lb .x,.lb .nav{position:absolute;color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:999px;width:42px;height:42px;font-size:20px}
.lb .x{top:16px;right:18px}.lb .nav{top:50%;transform:translateY(-50%)}.lb .prev{left:16px}.lb .next{right:16px}

/* ------------------------------------------------------------- present */
.pres{position:fixed;inset:0;background:#fff;z-index:40;display:none;flex-direction:column}
.pres.on{display:flex}
.pres .slide{flex:1;padding:5vh 7vw;overflow:hidden;display:flex;flex-direction:column;justify-content:center;min-height:0}
.pres .slide .shot{max-height:58vh;aspect-ratio:auto;object-fit:contain}
.pres .catgrid .ccard svg{width:min(15vh,130px);height:min(15vh,130px)}
.pres .t5r{padding:1.4vh 4px}.pres .t5r .ttl{font-size:clamp(16px,1.8vw,24px)}
.pres .overflow{outline:3px dashed var(--p1)}
.pres .slide h1{font-size:clamp(30px,4.6vw,58px);letter-spacing:-.02em;margin:0 0 .3em}
.pres .slide h2{font-size:clamp(22px,3vw,38px);margin:0 0 .5em}
.pres .slide p,.pres .slide li{font-size:clamp(16px,1.6vw,22px)}
.pres .slide .big{font-size:clamp(60px,10vw,140px);font-weight:800;line-height:1}
.pres .foot{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
.pres .two{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.pres .two .shot{aspect-ratio:auto;max-height:70vh;object-fit:contain;object-position:top;box-shadow:0 10px 40px rgba(20,30,60,.15)}
.pres .rings{grid-template-columns:repeat(4,1fr);gap:18px}
.pres .rings .ring svg{width:130px;height:130px}
.pres .t5 .row{grid-template-columns:60px 90px 1fr 1fr}
.pres blockquote{font-size:clamp(18px,2vw,28px);font-weight:600;border-left-width:5px;padding:10px 20px;line-height:1.35}
.pres .cover-logo{width:96px;height:96px;border-radius:22px;border:1px solid var(--line);padding:10px;object-fit:contain;margin-bottom:24px}
.pres .caveat{border-left:4px solid var(--p1);padding:10px 16px;background:#fff8f2;border-radius:0 10px 10px 0;max-width:900px}
.pres .verdict{font-size:clamp(20px,2.4vw,32px);font-weight:600;line-height:1.4;max-width:1000px}
.pres .persona-facts{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
.pres .persona-facts .tag{font-size:15px;padding:5px 12px}
.pres .icp h3{font-size:clamp(18px,2vw,26px);margin-top:18px}
.pres .icp li,.pres .icp p{font-size:clamp(14px,1.3vw,18px)}
.pres .icp pre{display:none}

/* ------------------------------------------------------------- compare */
.vd{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;text-transform:capitalize}
.vleads{background:#e6f4ec;color:var(--ok)}.vtrails{background:#fff0e0;color:var(--p1)}.vlevel{background:#eef0f3;color:#6b7482}.vnot{background:#f4f5f7;color:#9aa3b1}
.mk{font-weight:800;margin-right:2px}.mk2{color:var(--ok)}.mk1{color:var(--p2)}.mk0{color:var(--p0)}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
.tally div{padding:10px 6px;border-radius:10px;background:#f6f7f9}
.tally b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.tally span{font-size:12px;color:var(--mut);text-transform:capitalize}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:8px 0 14px}
.site{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.site.ours{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.slogo{width:44px;height:44px;border-radius:10px;object-fit:contain;border:1px solid var(--line);background:#fff;padding:3px;flex:none}
.slogo.blank{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--mut);background:#f2f4f8}
.site .nm{font-weight:700;line-height:1.2}.site .hs{font-size:12px;color:var(--mut)}
.site .mean{margin-left:auto;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
table.scoreby td.ours,table.scoreby th.ours{background:#f7f9ff}
table.scoreby td.sc{font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
.vs{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:16px 18px;margin:0 0 16px}
.vs .hd{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.vs h3{margin:0}.vs .hd .hs{font-size:12.5px;color:var(--mut)}
.vs .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.vs ul{margin:0;padding-left:0;list-style:none}
.vs li{padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.vs li:last-child{border-bottom:0}
.vs li b{display:block;font-weight:600}
.vs li .cl{color:var(--mut);font-size:12.5px}
.vs .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.vs .k.up{color:var(--ok)}.vs .k.down{color:var(--p1)}
table.matrix{font-size:13px}table.matrix td:first-child{font-weight:600;min-width:160px}
table.matrix td.ours,table.matrix th.ours{background:#f7f9ff}
table.matrix tr.hide{display:none}
@media (max-width:900px){.vs .cols{grid-template-columns:1fr}.tally{grid-template-columns:repeat(2,1fr)}}
.pres .tally b{font-size:clamp(40px,6vw,84px)}.pres .tally span{font-size:16px}
.pres .sites{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.pres .slogo{width:64px;height:64px}
.pres table.matrix{font-size:clamp(12px,1.1vw,16px)}
.pres .vs li{font-size:clamp(13px,1.3vw,18px)}
/*__ICP_CSS__*/
.icp-card{background:var(--card)}
.icp-primary{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.icp-bar b{background:var(--accent)}
.pres .icp-cards{grid-template-columns:repeat(3,1fr);align-items:start}
.pres .icp-head{align-items:flex-start}
.icp-big .icp-avatar{width:220px;height:220px;border-radius:40px}
.pres .icp-card{font-size:13px}
.pres .icp-two,.pres .icp-against,.pres .icp-rerun,.pres .icp-ni,.pres .icp-dl{display:none}
.pres .icp-who{font-size:clamp(14px,1.2vw,18px)}
.pres .icp-title{font-size:clamp(16px,1.5vw,22px)}
/* ------------------------------------------------------------- menu */
.menu{position:relative}
.menu .dd{position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(20,30,60,.12);min-width:230px;padding:6px;display:none;z-index:30}
.menu.on .dd{display:block}
.menu .dd button,.menu .dd label{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;font-size:13.5px;font-weight:600;cursor:pointer}
.menu .dd button:hover,.menu .dd label:hover{background:#f2f4f8}
.menu .dd{min-width:300px}
.menu .dd .ext{font-size:11.5px;font-weight:600;color:var(--mut);margin-left:4px}
.menu .dd .hint{display:block;font-size:12px;font-weight:400;color:var(--mut);margin-top:2px}
.menu .dd .foot{border-top:1px solid var(--line);margin-top:6px;padding:8px 10px 4px;font-size:12px;color:var(--mut)}
.menu .dd .foot button,.menu .dd .foot label{display:inline;width:auto;padding:0;font-size:12px;font-weight:600;color:var(--accent);background:none}
.menu .dd .foot button:hover,.menu .dd .foot label:hover{background:none;text-decoration:underline}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ------------------------------------------------------------- print */
/* Views are filled only when opened, so print builds its own document in #v-print (beforeprint). */
#v-print{display:none}
@media print{.top,.side,.drawer,.lb,.pres,.filters,.frow .go,#v-print .btn:not(.sm){display:none!important}main{margin:0;padding:0}.view{display:none!important}#v-print{display:block!important}#v-print .psec{break-before:page}#v-print .frow{break-inside:avoid}#v-print .frow .fix{display:block!important}#v-print [data-go].btn,#v-print a.btn[href="#top5"]{display:none!important}html,body,main{background:#fff!important}}
</style>
</head>
<body>
<header class="top">
  <img class="logo hide" id="logo" alt="">
  <div><div class="name" id="hname"></div><div class="sub" id="hsub"></div></div>
  <div class="sp"></div>
  <div class="overall" id="hoverall"></div>
  <button class="btn primary" id="btnPresent">▶ Present</button>
  <div class="menu" id="triageMenu">
    <button class="btn" id="btnTriage">Export ▾</button>
    <div class="dd">
      <button data-x="md"><b>Report</b> <span class="ext">.md</span><span class="hint">The summary and every issue, readable</span></button>
      <button data-x="pdf"><b>Report</b> <span class="ext">.pdf</span><span class="hint">Opens print — choose “Save as PDF”</span></button>
      <button data-x="csv"><b>Tracker</b> <span class="ext">.csv</span><span class="hint">One row per issue, with your triage — for Sheets, Jira, Linear</span></button>
      <button data-x="agent"><b>Fix list for a coding agent</b> <span class="ext">.md</span><span class="hint">Issues marked accepted (or all not rejected), with steps — for Claude Code or similar</span></button>
      <div class="foot">Triage marks: <button data-x="json">save</button> · <label>load<input type="file" id="triageFile" accept="application/json" class="hide"></label> · <button data-x="clear">clear</button></div>
    </div>
  </div>
</header>

<nav class="side" id="side"></nav>

<main id="main">
  <section class="view" id="v-overview"></section>
  <section class="view" id="v-top5"></section>
  <section class="view" id="v-findings"></section>
  <section class="view" id="v-lens"></section>
  <section class="view" id="v-personas"></section>
  <section class="view" id="v-persona"></section>
  <section class="view" id="v-icp"></section>
  <section class="view" id="v-compare"></section>
  <section class="view" id="v-quotes"></section>
  <section class="view" id="v-limits"></section>
  <section class="view" id="v-print"></section>
</main>

<aside class="drawer" id="drawer"><button class="btn sm close" id="drawerClose">✕</button><div id="drawerBody"></div></aside>

<div class="lb" id="lb">
  <button class="x" id="lbClose">✕</button>
  <button class="nav prev" id="lbPrev">‹</button>
  <img id="lbImg" alt="">
  <div class="cap" id="lbCap"></div>
  <button class="nav next" id="lbNext">›</button>
</div>

<div class="pres" id="pres">
  <div class="slide" id="slide"></div>
  <div class="foot"><span id="presPos"></span><span>← → to move · Esc to leave</span><span id="presTitle"></span></div>
</div>

<div class="toast" id="toast"></div>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
(() => {
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IMG = D.images || {};
const LENS = D.lenses || [];
const F = D.findings || [];
const byId = Object.fromEntries(F.map(f => [f.id, f]));
const P = D.personas || [];
const SEVS = ['P0','P1','P2','P3'];
const STATUSES = ['open','accepted','rejected','fixed'];
const hue = s => s == null ? 'var(--mut)' : s <= 3 ? 'var(--p0)' : s <= 5 ? 'var(--p1)' : s <= 7 ? 'var(--p2)' : 'var(--ok)';
document.documentElement.style.setProperty('--accent', D.meta.accent || '#1a56db');

// ------------------------------------------------------------ helpers
const src = rel => (IMG[rel] || {}).src || '';
const img = (rel, cls='shot', ctx) => rel && src(rel)
  ? `<img class="${cls}" src="${src(rel)}" alt="" data-shot="${esc(rel)}" ${ctx?`data-ctx="${esc(ctx)}"`:''} loading="lazy">` : '';
const SEVL = {P0:['🛑','Blocker'],P1:['🔴','High'],P2:['🟠','Medium'],P3:['⚪','Low']};
const sev = s => SEVL[s] ? `<span class="chip sev-${s}">${SEVL[s][0]} ${SEVL[s][1]}<span class="code"> · ${s}</span></span>` : `<span class="chip">${esc(s)}</span>`;
const CATS = D.categories || [];
const CAT = Object.fromEntries(CATS.map(c=>[c.key,c]));
const catChip = (key, sub='') => { const c=CAT[key]; return c ? `<span class="cat" style="--c:${c.colour}">${c.emoji} ${esc(c.label)}${sub?`<span class="sub"> › ${esc(sub)}</span>`:''}</span>` : (sub?`<span class="tag">${esc(sub)}</span>`:''); };
const CATF = F.filter(f=>CAT[f.cat]);          // findings filed in one of the five categories
const LINES = D.lines || {};
const personaLabel = n => esc(n);
const fmtSecs = s => s == null ? '—' : `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function ring(score, size=82, label='') {
  const r = 34, c = 2*Math.PI*r, v = score == null ? 0 : score/10;
  return `<svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="#eceff3" stroke-width="8"/>
   <circle cx="42" cy="42" r="${r}" fill="none" stroke="${hue(score)}" stroke-width="8" stroke-linecap="round"
   stroke-dasharray="${(c*v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 42 42)"/>
   <text x="42" y="47" text-anchor="middle" font-size="22" font-weight="800" fill="${hue(score)}">${score==null?'–':score}</text></svg>`;
}
const VCLS = v => v==='leads'?'vleads':v==='trails'?'vtrails':v==='level'?'vlevel':'vnot';
const vd = v => `<span class="vd ${VCLS(v)}">${esc(v)}</span>`;
const mk = c => { const s=String(c??''); const m={'✓':2,'⚠':1,'✗':0}[s[0]]; return m==null?esc(s):`<span class="mk mk${m}">${s[0]}</span>${esc(s.slice(1).trim())}`; };
const slogo = (st, cls='slogo') => st.logo ? `<img class="${cls}" src="${st.logo}" alt="">` : `<span class="${cls} blank">${esc((st.name||'?')[0].toUpperCase())}</span>`;
function tallyRing(t, size=82){
  const r=34, c=2*Math.PI*r, n=(t.leads||0)+(t.trails||0)+(t.level||0)||1;
  const segs=[['leads','var(--ok)'],['trails','var(--p1)'],['level','#c9ced6']]; let off=0, arcs='';
  for (const [k,col] of segs){ const len=c*(t[k]||0)/n; arcs+=`<circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-dasharray="${len.toFixed(1)} ${c.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 42 42)"/>`; off+=len; }
  return `<svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="#eceff3" stroke-width="8"/>${arcs}
   <text x="42" y="40" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ok)">▲ ${t.leads||0}</text>
   <text x="42" y="58" text-anchor="middle" font-size="15" font-weight="800" fill="var(--p1)">▼ ${t.trails||0}</text></svg>`;
}
const lensRing = (l, go=true) => l.tally
  ? `<div class="ring" ${go?'data-go="compare"':'style="cursor:default"'}>${tallyRing(l.tally)}<div class="lab">${esc(l.label)}</div><div class="n">leads ${l.tally.leads} · trails ${l.tally.trails} · level ${l.tally.level}</div></div>`
  : `<div class="ring" ${go?`data-go="lens/${encodeURIComponent(l.dir)}"`:'style="cursor:default"'}>${ring(l.score)}<div class="lab">${esc(l.label)}</div><div class="n">${go?`${l.count} finding${l.count===1?'':'s'}`:esc(l.looksFor||'')}</div></div>`;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1800); }

// ------------------------------------------------------------ triage state
const TKEY = 'understudy-triage-' + (D.meta.runId || D.meta.product);
let triage = {};
try { triage = JSON.parse(localStorage.getItem(TKEY) || '{}') || {}; } catch(e) { triage = {}; }
const saveTriage = () => { try { localStorage.setItem(TKEY, JSON.stringify(triage)); } catch(e) {} };
const status = id => (triage[id] || {}).status || 'open';

// ------------------------------------------------------------ header + nav
$('#hname').textContent = D.meta.product;
$('#hsub').textContent = `${D.meta.kind} · ${D.meta.date}` + (D.meta.url ? ` · ${D.meta.url.replace(/^https?:\/\//,'')}` : '');
if (D.meta.logo) { const l=$('#logo'); l.src=D.meta.logo; l.classList.remove('hide'); const link=document.createElement('link'); link.rel='icon'; link.href=D.meta.logo; document.head.appendChild(link); }
$('#hoverall').innerHTML = D.overall != null ? `Overall <b style="color:${hue(D.overall)}">${D.overall}</b>/10` : '';

function renderNav(){
  const h = location.hash.slice(1) || 'overview';
  const parts = h.split('/');
  const cur = parts[0], arg = decodeURIComponent(parts.slice(1).join('/'));
  const curCat = cur==='cat' ? arg : cur==='lens' ? (LENS.find(l=>l.dir===arg)||{}).cat : '';
  const a = (href, label, on, cls='', n='') => `<a href="#${href}" class="${cls} ${on?'on':''}"><span>${label}</span>${n!==''?`<span class="n">${n}</span>`:''}</a>`;
  const bar = s => `<span class="n"><span class="sc">${s??'–'}</span><span class="bar"><i style="width:${(s||0)*10}%;background:${hue(s)}"></i></span></span>`;
  let out = `<div class="grp">🏁 Overview</div>` + a('overview','Summary',cur==='overview','sub') + a('top5','Top 5 to fix',cur==='top5','sub');
  out += `<div class="grp">🔎 Findings</div>` + a('findings','All issues',cur==='findings','sub',CATF.length);
  for (const c of CATS){
    out += `<a href="#cat/${c.key}" class="sub ${curCat===c.key&&cur==='cat'?'on':''}"><span>${c.emoji} ${esc(c.label)}</span>${bar(c.score)}</a>`;
    // check rows show their score like the category above them; mixing a count in the same column reads as one
    if (curCat===c.key) out += c.checks.map(d=>{ const l=LENS.find(x=>x.dir===d); return l?`<a href="#lens/${encodeURIComponent(d)}" class="subsub ${cur==='lens'&&arg===d?'on':''}"><span>${esc(l.short)}</span>${bar(l.score)}</a>`:''; }).join('');
  }
  out += `<div class="grp">👤 Customers</div>` + a('personas','Sessions',cur==='personas'||cur==='persona','sub',P.length)
       + a('quotes','In their own words',cur==='quotes','sub') + (D.sections.buyer?a('buyer','What a buyer could find',cur==='buyer','sub'):'')
       + (D.icp?a('icp',"Who it's for",cur==='icp','sub'):'');
  if (D.compare) out += `<div class="grp">⚔️ Competitors</div>` + a('compare','Comparison',cur==='compare','sub');
  out += `<div class="grp">📋 About this report</div>` + a('about','How it was produced',cur==='about','sub') + a('limits','Limits',cur==='limits','sub');
  $('#side').innerHTML = out;
}

// ------------------------------------------------------------ views
function catRing(c){ return `<div class="ccard" style="--c:${c.colour}" data-go="cat/${c.key}">${ring(c.score)}<div class="lab">${c.emoji} ${esc(c.label)}</div><div class="q">${esc(c.question)}</div><div class="n">${c.count} issue${c.count===1?'':'s'}${c.sev.P1||c.sev.P0?` · <b style="color:var(--p1)">${(c.sev.P0||0)+(c.sev.P1||0)} high</b>`:''}</div></div>`; }
function t5rows(){
  return (D.top5||[]).map(r=>{ const f=byId[r.id]||{}; return `<div class="t5r" data-fid="${esc(r.id)}"><div class="num">${r.n}</div><div><div>${sev(r.sev)} ${catChip(f.cat,f.check)}</div><div class="ttl">${esc(r.what)}</div>${f.shortFix?`<div class="small mut"><b style="color:var(--ink)">Fix:</b> ${esc(f.shortFix)}</div>`:''}</div><div class="eff">${esc(r.effort)}</div></div>`; }).join('');
}
function vOverview(){
  const caveat = D.meta.personaMode !== 'supplied'
    ? `<p class="small mut" style="margin-top:10px">The users were constructed, not researched.</p>` : '';
  const counts = SEVS.filter(s=>CATF.some(f=>f.sev===s)).map(s => `${sev(s)} ${CATF.filter(f=>f.sev===s).length}`).join(' &nbsp; ');
  return `
  ${LINES.whatLine?`<p class="mut" style="margin:0 0 14px">${esc(LINES.whatLine)}</p>`:`<div class="mut" style="margin:0 0 14px">${D.sections.whatThisIs||''}</div>`}
  <div class="hero">
    <div class="card" style="flex:1;margin:0"><div class="kicker">The verdict</div><div class="verdict">${esc(D.verdict)}</div>${caveat}</div>
    <div class="card ring big" style="margin:0;min-width:200px;cursor:default">${ring(D.overall,120)}<div class="lab">Overall</div><div class="n">mean of ${CATS.length} categories</div></div>
  </div>
  <div class="card"><div class="kicker">Scorecard — click a category</div>
    <div class="catgrid" style="margin-top:10px">${CATS.map(catRing).join('')}</div>
    <p class="small mut" style="margin:12px 0 0">${CATF.length} issues — ${counts}</p></div>
  <div class="grid g2">
    <div class="card"><div class="kicker">Top 5 to fix</div>${(D.top5||[]).map(r=>`<div class="t5r" data-fid="${esc(r.id)}" style="grid-template-columns:24px 1fr"><div class="num" style="font-size:18px">${r.n}</div><div>${sev(r.sev)}<div style="font-weight:600;margin-top:4px">${esc(r.what)}</div></div></div>`).join('')}<p style="margin:12px 0 0"><a href="#top5" class="btn sm">Open the Top 5 →</a></p></div>
    <div class="card"><div class="kicker">✅ What the site does well</div><ul style="padding-left:18px;margin:0">${(D.doesWell||[]).map(b=>`<li style="margin-bottom:6px">${esc(b)}</li>`).join('')}</ul>
    ${D.compare?`<div class="kicker" style="margin-top:16px">⚔️ Against competitors</div><p style="margin:0">${esc(LINES.compareVerdict||D.compare.verdict)}</p><p style="margin:10px 0 0"><a href="#compare" class="btn sm">Open the comparison →</a></p>`:''}</div>
  </div>`;
}
function vTop5(){
  return `<h2>🏁 Top 5 to fix</h2><p class="mut">${esc(D.verdict)}</p><div class="card">${t5rows()}</div>
  <p class="small mut">Click an issue for evidence and the full fix.</p>`;
}

// findings explorer
const FLT = { sev:new Set(), cat:new Set(), lens:new Set(), q:'' };
function passes(f){
  if (FLT.sev.size && !FLT.sev.has(f.sev)) return false;
  if (FLT.cat.size && !FLT.cat.has(f.cat)) return false;
  if (FLT.lens.size && !FLT.lens.has(f.lens)) return false;
  if (FLT.q){ const q=FLT.q.toLowerCase(); const hay=[f.short,f.title,f.sowhat,f.locator,f.id,...(f.observed||[]),f.fix].join(' ').toLowerCase(); if(!hay.includes(q)) return false; }
  return true;
}
function frow(f){
  return `<div class="frow ${location.hash.endsWith('/'+f.id)?'on':''}" data-fid="${f.id}"><div class="lead">${sev(f.sev)}${catChip(f.cat,f.check)}</div>
    <div><div class="t">${esc(f.short||f.title)}</div>${f.shortFix?`<div class="fix"><b>Fix:</b> ${esc(f.shortFix)}</div>`:''}</div><div class="go">${status(f.id)!=='open'?`<span class="st st-${status(f.id)}">${status(f.id)}</span> `:''}▸</div></div>`;
}
function vFindings(scope){
  // scope: undefined = all · {cat} · {lens}
  const base = CATF.filter(f => !scope || (scope.cat && f.cat===scope.cat) || (scope.lens && f.lens===scope.lens));
  const list = base.filter(passes).sort((a,b)=> a.sev.localeCompare(b.sev) || a.cat.localeCompare(b.cat));
  const chip = (grp,val,label) => `<button class="f ${FLT[grp].has(val)?'on':''}" data-flt="${grp}" data-val="${esc(val)}">${label}</button>`;
  return `${scope?'':'<h2>🔎 All issues</h2><p class="mut">'+esc((D.merge&&D.merge.note)||'Each issue appears once, under the check where its fix lives.')+'</p>'}
  <div class="filters">
    ${SEVS.filter(s=>base.some(f=>f.sev===s)).map(s=>chip('sev',s,`${SEVL[s][0]} ${SEVL[s][1]} ${base.filter(f=>f.sev===s).length}`)).join('')}
    <span class="sep"></span>
    ${scope?'':CATS.map(c=>chip('cat',c.key,`${c.emoji} ${esc(c.label)}`)).join('')+'<span class="sep"></span>'}
    <input placeholder="Search…" id="fq" value="${esc(FLT.q)}">
    <span class="small mut">${list.length} of ${base.length}</span>
  </div>
  <div class="flist">${list.map(frow).join('') || '<div style="padding:20px" class="mut">Nothing matches these filters.</div>'}</div>`;
}
function vCat(key, lensDir){
  const c = CAT[key]; if(!c) return '<p class="mut">No such category.</p>';
  const ls = c.checks.map(d=>LENS.find(l=>l.dir===d)).filter(Boolean);
  const l = lensDir ? LENS.find(x=>x.dir===lensDir) : null;
  return `<div class="hero"><div class="card" style="flex:1;margin:0;border-top:4px solid ${c.colour}"><div class="kicker">${c.emoji} ${esc(c.label)}${l?` › ${esc(l.short)}`:''}</div><div class="verdict">${esc(c.question)}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">${ls.map(x=>`<a class="btn sm ${l&&l.dir===x.dir?'primary':''}" href="#lens/${encodeURIComponent(x.dir)}">${esc(x.short)} · ${x.score??'–'}/10 · ${x.count}</a>`).join('')}${l?`<a class="btn sm" href="#cat/${key}">All ${esc(c.label)}</a>`:''}</div></div>
    <div class="card ring big" style="margin:0;min-width:200px;cursor:default">${ring(l?l.score:c.score,120)}<div class="lab">${l?esc(l.short):esc(c.label)}</div><div class="n">${l?esc(l.looksFor||''):`mean of ${ls.length} check${ls.length===1?'':'s'}`}</div></div></div>
  ${vFindings(l?{lens:l.dir}:{cat:key})}`;
}
function pcard(p){
  const f = p.facts||{};
  const line = f.kind==='journey' ? (f.firstValue ? `Reached first value in ${fmtSecs(f.ttfv)}` : 'Did not reach first value')
    : f.kind==='visit' ? `Understood the site in ${f.comprehension??'?'}s · ${f.priceFound?'found a price':'no price found'}` : '';
  return `<div class="pcard" data-go="persona/${encodeURIComponent(p.name)}">${img(p.shots[0],'shot',p.dir)}<div><h3>${personaLabel(p.name)}</h3>
    <div class="facts">${esc(f.device||'')}${f.kind?` · ${f.kind}`:''}${f.minutes?` · ${f.minutes} min`:''}<br>${esc(line)}${f.leftEarly?' · <b style="color:var(--p1)">left early</b>':''}</div></div></div>`;
}
function vPersonas(){ return `<h2>👤 Sessions</h2><p class="mut">One card per recorded session. Open one to replay it.</p><div class="grid g2">${P.map(pcard).join('')}</div>`; }

let replayTimer = null;
function vPersona(name, tab='replay'){
  const p = P.find(x=>x.name===name); if(!p) return '<p class="mut">No such persona.</p>';
  const f = p.facts||{};
  const facts = [f.device, f.kind, f.minutes?`${f.minutes} min`:'', f.kind==='journey'?(f.firstValue?`first value at ${fmtSecs(f.ttfv)}`:'no first value'):'', f.leftEarly?'left early':''].filter(Boolean);
  const tabs = ['replay','screens','reactions','debrief','findings'];
  let body='';
  if (tab==='replay'){
    const first = p.log[0]?.shot || p.shots[0] || '';
    body = `<div class="replay"><div><div class="ctl"><button class="btn sm" id="rpPlay">▶ Play</button><input type="range" id="rpRange" min="0" max="${Math.max(0,p.log.length-1)}" value="0"><span class="small mut" id="rpPos">1 / ${p.log.length}</span></div>

function matrixTable(rows, cls='matrix', filter=''){

// ------------------------------------------------------------ triage export
// Every export reads the payload as rendered: nothing here scores, ranks or rewrites a finding.
const SEV_ORDER = {P0:0,P1:1,P2:2,P3:3};
const T5 = Object.fromEntries((D.top5||[]).map((r,i)=>[r.id,i]));
const bySev = (a,b) => (SEV_ORDER[a.sev]??9)-(SEV_ORDER[b.sev]??9) || (T5[a.id]??99)-(T5[b.id]??99);
const catName = f => CAT[f.cat] ? CAT[f.cat].label : "Who it's for";
const pageUrl = f => /^\//.test(f.locator||'') && D.meta.url ? D.meta.url.replace(/\/$/,'')+f.locator : (f.locator||'');
const noteOf = id => (triage[id]||{}).note || '';
const mdList = xs => xs.map(x=>`- ${x}`).join('\n');

function reportMd(){
  const L = [`# ${D.meta.product} — ${D.meta.kind} — ${D.meta.date}`, ''];
  if (D.overall!=null) L.push(`**Overall ${D.overall}/10** · ${F.length} issues`, '');
  if (D.verdict) L.push(`> ${D.verdict}`, '');
  if ((D.top5||[]).length){ L.push('## Top 5 to fix',''); D.top5.forEach(r=>L.push(`${r.n}. **${r.sev}** ${r.what}${r.effort?` — _${r.effort}_`:''}`)); L.push(''); }
  if ((D.doesWell||[]).length) L.push('## What works', '', mdList(D.doesWell), '');
  L.push('## Scores', '', '| Area | Score | Issues |', '|---|---|---|');
  CATS.forEach(c=>L.push(`| ${c.label} | ${c.score??'–'}/10 | ${c.count} |`)); L.push('');
  for (const c of [...CATS, {key:null,label:"Who it's for"}]){
    const fs = F.filter(f=>c.key ? f.cat===c.key : !CAT[f.cat]).sort(bySev);
    if (!fs.length) continue;
    L.push(`## ${c.label}`, '');
    for (const f of fs){
      L.push(`### ${f.sev} — ${f.short||f.title}`, '', `${f.lensLabel} · \`${f.id}\`${status(f.id)!=='open'?` · triage: **${status(f.id)}**`:''}`, '');
      if (f.sowhat) L.push(`**Why it matters:** ${f.sowhat}`, '');
      if (f.observed.length) L.push('**Observed:**', mdList(f.observed), '');
      if (f.fix) L.push(`**Fix:** ${f.fix}`, '');
      if ((f.merged||[]).length) L.push(`**Also raised as:**`, mdList(f.merged.map(m=>`${m.check} ${m.sev} — ${m.title}`)), '');
      if (noteOf(f.id)) L.push(`**Note:** ${noteOf(f.id)}`, '');
    }
  }
  if ((D.limits||[]).length) L.push('## Limits', '', mdList(D.limits), '');
  return L.join('\n');
}

// The brief for a coding agent: what it needs to act without the run folder open.
// Issues accepted in triage; if none are, every issue not rejected or already fixed.
function agentMd(){
  const acc = F.filter(f=>status(f.id)==='accepted');
  const pick = (acc.length ? acc : F.filter(f=>!['rejected','fixed'].includes(status(f.id)))).sort(bySev);
  const L = [`# Fix list — ${D.meta.product}`, '',
    `Source: understudy ${D.meta.kind.toLowerCase()} of ${D.meta.url||D.meta.product}, ${D.meta.date}. ${pick.length} issue${pick.length===1?'':'s'}, most severe first.`,
    acc.length ? 'Selection: issues accepted in triage.' : 'Selection: every issue not rejected or marked fixed (none were accepted in triage).', '',
    '## How to work this list', '',
    '- Each issue was observed on the live product by a simulated user. Quotes and numbers are from the recording; do not treat them as requirements to copy.',
    '- Severity: P0 blocks the job · P1 they get through but would not become a customer · P2 friction · P3 polish.',
    '- For each issue: find where it lives in the code, reproduce it from the steps, make the fix, then check the "Done when" line.',
    '- Screenshots are named, not embedded. They live in the understudy run folder; ask for one if the text is not enough.',
    '- If a fix is a product or copy decision rather than code, say so instead of guessing.', ''];
  pick.forEach((f,i)=>{
    L.push(`## ${i+1}. ${f.sev} — ${f.short||f.title}`, '',
      `- **Id:** \`${f.id}\` · **Area:** ${catName(f)} · **Raised by:** ${[f.lensLabel, ...(f.merged||[]).map(m=>m.check)].join(', ')}`);
    if (pageUrl(f)) L.push(`- **Where:** ${pageUrl(f)}`);
    const who = f.personas.filter(p=>p && p!=='n/a');
    if (who.length) L.push(`- **Seen by:** ${who.join(', ')}`);
    L.push('');
    if (f.sowhat) L.push(`**Why it matters:** ${f.sowhat}`, '');
    const seen = [...f.observed, ...(f.merged||[]).flatMap(m=>m.observed||[])];
    if (seen.length) L.push('**What happens:**', mdList([...new Set(seen)]), '');
    if (f.repro.length) L.push('**Steps to reproduce:**', f.repro.map((r,k)=>`${k+1}. ${r}`).join('\n'), '');
    if (f.evidence) L.push(`**Evidence:** ${f.evidence}`, '');
    if (f.shots.length) L.push(`**Screenshots:** ${f.shots.map(s=>'`'+s+'`').join(', ')}`, '');
    L.push(`**Fix:** ${f.fix||f.shortFix||'not stated by the check — decide from the evidence'}`, '',
      `**Done when:** following the same path, what "What happens" describes no longer occurs${f.fix?', and the change matches the fix above':''}.`, '');
    if (noteOf(f.id)) L.push(`**Reviewer note:** ${noteOf(f.id)}`, '');
  });
  return L.join('\n');
}

function exportTriage(kind){
  if (kind==='pdf'){ $('#triageMenu').classList.remove('on'); setTimeout(()=>window.print(), 50); return; }
  let text, name, type='text/markdown';
  if (kind==='json'){ text=JSON.stringify({run:D.meta.runId, product:D.meta.product, exported:new Date().toISOString(), triage}, null, 2); name='triage.json'; type='application/json'; }
  else if (kind==='csv'){
    const rows = [...F].sort(bySev).map(f=>({id:f.id, severity:f.sev, area:catName(f), check:f.lensLabel, title:f.short||f.title, why_it_matters:f.sowhat||'', fix:f.shortFix||f.fix||'', where:pageUrl(f), raised_by:[f.lensLabel, ...(f.merged||[]).map(m=>m.check)].join('; '), personas:f.personas.join('; '), status:status(f.id), note:noteOf(f.id)}));
    const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    text=[Object.keys(rows[0]).join(',')].concat(rows.map(r=>Object.values(r).map(q).join(','))).join('\n'); name='tracker.csv'; type='text/csv';
  }
  else if (kind==='agent'){ text=agentMd(); name='fix-list-for-agent.md'; }
  else { text=reportMd(); name='report.md'; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=`${(D.meta.product||'run').toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${name}`; a.click(); toast(`Saved ${name}`);
}
$('#btnTriage').onclick=e=>{ e.stopPropagation(); $('#triageMenu').classList.toggle('on'); };
document.addEventListener('click',()=>$('#triageMenu').classList.remove('on'));
$('#triageMenu .dd').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; const k=b.dataset.x; if(k==='clear'){ if(confirm('Clear every status and note saved for this report on this device?')){ triage={}; saveTriage(); render(); toast('Triage cleared'); } } else exportTriage(k); };
$('#triageFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const j=JSON.parse(t); const t2=j.triage||j; Object.assign(triage,t2); saveTriage(); render(); toast(`Imported ${Object.keys(t2).length} entries`);}catch(err){ toast('Not a triage file'); } }); e.target.value=''; };
// ------------------------------------------------------------ print
// One document from the views: overview, each category with its issues, who it's for, quotes, limits.
// Filters are cleared for the print so a filtered screen never prints a partial list.
let FLT_SAVED = null;
window.addEventListener('beforeprint', ()=>{
  FLT_SAVED = {sev:new Set(FLT.sev), cat:new Set(FLT.cat), lens:new Set(FLT.lens), q:FLT.q};
  FLT.sev.clear(); FLT.cat.clear(); FLT.lens.clear(); FLT.q='';
  const parts = [vOverview(), ...CATS.map(c=>vCat(c.key)), D.icp?vIcp():'', (D.quotes||[]).length?vQuotes():'', vLimits()].filter(Boolean);
  $('#v-print').innerHTML = parts.map((h,i)=>`<div class="${i?'psec':''}">${h}</div>`).join('');
  $('#v-print').querySelectorAll('details').forEach(d=>d.open=true);
});
window.addEventListener('afterprint', ()=>{
  $('#v-print').innerHTML = '';
  if (FLT_SAVED) Object.assign(FLT, FLT_SAVED);
});

// ------------------------------------------------------------ router
function render(){
  const h = location.hash.slice(1) || 'overview';
  const [view, ...rest] = h.split('/');
  const arg = decodeURIComponent(rest.join('/'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  clearInterval(replayTimer);
  let target = 'overview', htmlOut = '';
  switch(view){
    case 'top5': target='top5'; htmlOut=vTop5(); break;
    case 'findings': target='findings'; htmlOut=vFindings(); break;
    case 'cat': target='lens'; htmlOut=vCat(arg); break;
    case 'lens': { target='lens'; const l=LENS.find(x=>x.dir===arg); htmlOut=l&&l.dir==='compare'?vCompare():vCat(l?l.cat:'',arg); break; }
    case 'buyer': target='quotes'; htmlOut=vBuyer(); break;
    case 'about': target='limits'; htmlOut=vAbout(); break;
    case 'personas': target='personas'; htmlOut=vPersonas(); break;
    case 'persona': { target='persona'; const [name,tab]=arg.split('/'); htmlOut=vPersona(name,tab||'replay'); break; }
    case 'icp': target='icp'; htmlOut=vIcp(); break;
    case 'compare': target='compare'; htmlOut=vCompare(); break;
    case 'quotes': target='quotes'; htmlOut=vQuotes(); break;
    case 'limits': target='limits'; htmlOut=vLimits(); break;
    default: target='overview'; htmlOut=vOverview();
  }
  const el = $('#v-'+target); el.innerHTML = htmlOut; el.classList.add('on');
  renderNav();
  wire(el);
  // A view change closes the drawer; a deep link to a finding reopens it.
  $('#drawer').classList.remove('on');
  if (view==='findings' && arg && byId[arg]) openFinding(arg);
  if (view!=='persona') window.scrollTo(0,0);
}
function wire(el){
  el.querySelectorAll('[data-go]').forEach(x=>x.onclick=e=>{ if(e.target.closest('[data-shot]')) return; location.hash='#'+x.dataset.go; });
  el.querySelectorAll('.t5r[data-fid]').forEach(x=>x.onclick=()=>openFinding(x.dataset.fid));
  el.querySelectorAll('.frow').forEach(x=>x.onclick=()=>{ const id=x.dataset.fid; const base=location.hash.split('/')[0]; if(base==='#findings'||base==='#'+'findings') history.replaceState(null,'','#findings/'+id); el.querySelectorAll('.frow').forEach(r=>r.classList.toggle('on',r===x)); openFinding(id); });
  el.querySelectorAll('[data-mf]').forEach(b=>b.onclick=()=>{ MFILT=b.dataset.mf; render(); });
  el.querySelectorAll('[data-flt]').forEach(b=>b.onclick=()=>{ const s=FLT[b.dataset.flt]; s.has(b.dataset.val)?s.delete(b.dataset.val):s.add(b.dataset.val); render(); });
  const q=el.querySelector('#fq'); if(q){ q.oninput=e=>{ FLT.q=e.target.value; const pos=q.selectionStart; render(); const q2=$('#fq'); if(q2){q2.focus(); q2.setSelectionRange(pos,pos);} }; }
  el.querySelectorAll('[data-ptab]').forEach(b=>b.onclick=()=>{ const name=decodeURIComponent(location.hash.split('/')[1]); location.hash=`#persona/${encodeURIComponent(name)}/${b.dataset.ptab}`; });
  // replay
  const log=el.querySelector('#rpLog');
  if(log){
    const name=decodeURIComponent(location.hash.split('/')[1]); const p=P.find(x=>x.name===name);
    const go=i=>{ i=Math.max(0,Math.min(p.log.length-1,i)); log.querySelectorAll('div').forEach(d=>d.classList.toggle('on',+d.dataset.i===i)); const l=p.log[i]; if(l&&l.shot){ $('#rpShot').src=src(l.shot); $('#rpShot').dataset.shot=l.shot; $('#rpCap').textContent=l.shot; } $('#rpRange').value=i; $('#rpPos').textContent=`${i+1} / ${p.log.length}`; const d=log.querySelector('.on'); if(d) d.scrollIntoView({block:'nearest'}); wire._i=i; };
    wire._i=0;
    log.querySelectorAll('div').forEach(d=>d.onclick=()=>go(+d.dataset.i));
    $('#rpRange').oninput=e=>go(+e.target.value);
    $('#rpPlay').onclick=()=>{ if(replayTimer){ clearInterval(replayTimer); replayTimer=null; $('#rpPlay').textContent='▶ Play'; return; } $('#rpPlay').textContent='⏸ Pause'; replayTimer=setInterval(()=>{ if(wire._i>=p.log.length-1){ clearInterval(replayTimer); replayTimer=null; $('#rpPlay').textContent='▶ Play'; return; } go(wire._i+1); },2600); };
    wire.replayGo=go;
  }
}
document.addEventListener('click',e=>{ const s=e.target.closest('[data-shot]'); if(s&&s.dataset.shot){ e.preventDefault(); e.stopPropagation(); openLightbox(s.dataset.shot, s.dataset.ctx); } });
document.addEventListener('keydown',e=>{
  if($('#lb').classList.contains('on')){ if(e.key==='Escape') $('#lb').classList.remove('on'); if(e.key==='ArrowLeft') $('#lbPrev').click(); if(e.key==='ArrowRight') $('#lbNext').click(); return; }
  if($('#pres').classList.contains('on')){ if(e.key==='Escape') present(false); if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ if(si<SL.length-1){si++;showSlide();} e.preventDefault(); } if(e.key==='ArrowLeft'||e.key==='PageUp'){ if(si>0){si--;showSlide();} e.preventDefault(); } if(e.key==='Home'){si=0;showSlide();} if(e.key==='End'){si=SL.length-1;showSlide();} return; }
  if($('#drawer').classList.contains('on') && e.key==='Escape'){ $('#drawerClose').click(); return; }
  if(wire.replayGo && !e.target.matches('input,textarea')){ if(e.key==='ArrowDown'||e.key==='j'){ wire.replayGo(wire._i+1); e.preventDefault(); } if(e.key==='ArrowUp'||e.key==='k'){ wire.replayGo(wire._i-1); e.preventDefault(); } }
});
window.addEventListener('hashchange', ()=>{ wire.replayGo=null; render(); });
render();
})();
</script>
