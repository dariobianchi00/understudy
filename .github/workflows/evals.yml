name: evals

# The weekly check on the fake site. Needs a model, so it costs money and
# runs on a schedule rather than on every push. Results are committed to the
# evals-results branch; a failed safety case or contract gate opens an issue.
#
# Requires the repository secret CLAUDE_CODE_OAUTH_TOKEN (see evals/README.md).

on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      lenses:
        description: "space-separated lenses, or all"
        default: "all"
      runs:
        description: "runs per lens"
        default: "1"

permissions:
  contents: write        # push results to the evals-results branch
  issues: write          # open an issue on a failed gate or safety case

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # A Claude subscription token from `claude setup-token`, not an API key.
      # Spend lands on the plan's usage window; a window that runs out is
      # recorded by the runners as skipped, never as a failure.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install claude
        run: npm install -g @anthropic-ai/claude-code

      - name: start from the published results
        # The history CSVs are append-only logs and trend.md is derived from
        # them. main carries rows from local runs, evals-results carries the
        # weekly ones, and neither is a superset — so union them: every result
        # folder from both, every CSV row from both, sorted by stamp, then
        # rebuild the trend. Without this each publish silently dropped the
        # rows the other branch had.
        run: |
          set -e
          R=understudy/evals/results
          if ! git fetch origin evals-results:refs/remotes/origin/evals-results 2>/dev/null; then
            echo "no evals-results branch yet; starting from main"; exit 0
          fi
          mkdir -p "$RUNNER_TEMP/branch"
          git archive origin/evals-results "$R" | tar -x -C "$RUNNER_TEMP/branch"
          cp -rn "$RUNNER_TEMP/branch/$R/." "$R/"
          for f in "$R"/*.csv; do
            b="$RUNNER_TEMP/branch/$f"; [ -f "$b" ] || continue
            grep -Fxv -f "$f" "$b" >> "$f" || true
            { head -1 "$f"; tail -n +2 "$f" | sort -s -t, -k1,1; } > "$f.tmp" && mv "$f.tmp" "$f"
          done
          python3 understudy/evals/run_evals.py --trend > /dev/null

      - name: plumbing still green
        run: python3 -m unittest discover -s understudy/tests

      - name: claude is usable with this key
        # Fails the job before any lens runs if the CLI cannot answer — a
        # missing or expired token must never be recorded as 'recall 0/3'.
        run: |
          claude -p "Reply with the single word OK." --model sonnet --output-format json \
            --no-session-persistence --max-budget-usd 0.25 | tee preflight.json
          python3 -c "import json;d=json.load(open('preflight.json'));assert not d.get('is_error') and 'OK' in (d.get('result') or '').upper(), d"

      - name: lens evals — site
        id: site
        continue-on-error: true
        run: |
          set -o pipefail
          L=""; for l in ${{ github.event.inputs.lenses || 'all' }}; do L="$L --lens $l"; done
          python3 understudy/evals/run_evals.py --capture site $L \
            --runs ${{ github.event.inputs.runs || 1 }} --budget-usd 4 | tee site.log
      - name: lens evals — product
        id: product
        continue-on-error: true
        run: |
          set -o pipefail
          L=""; for l in ${{ github.event.inputs.lenses || 'all' }}; do L="$L --lens $l"; done
          python3 understudy/evals/run_evals.py --capture product $L \
            --runs ${{ github.event.inputs.runs || 1 }} --budget-usd 4 | tee product.log
      - name: behaviour evals
        id: behaviour
        continue-on-error: true
        run: |
          set -o pipefail
          python3 understudy/evals/run_behaviour.py --budget-usd 3 | tee behaviour.log

      - name: keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-logs
          path: |
            site.log
            product.log
            behaviour.log
            understudy/evals/results/
          if-no-files-found: ignore

      - name: publish results
        # Results start from the branch's copy (see "start from the published
        # results"), so history.csv already carries every earlier row. Save the
        # tree aside, force the branch checkout, put the tree back, commit, push.
        # The earlier `checkout -B ... 2>/dev/null || checkout -B` silently fell
        # back to branching off main once the two branches' history files
        # differed — observed 2026-09-14 as a non-fast-forward push.
        if: always()
        run: |
          git config user.name "understudy-evals"
          git config user.email "evals@users.noreply.github.com"
          cp -r understudy/evals/results "$RUNNER_TEMP/results"
          git fetch origin evals-results:refs/remotes/origin/evals-results || true
          git checkout -f -B evals-results origin/evals-results || git checkout -f -B evals-results
          rm -rf understudy/evals/results
          cp -r "$RUNNER_TEMP/results" understudy/evals/results
          git add understudy/evals/results
          git commit -m "evals: $(date -u +%F)" || echo "nothing new"
          git push origin evals-results

      - name: open an issue on a failed gate or safety case
        if: always() && (steps.behaviour.outcome == 'failure' || steps.site.outcome == 'failure' || steps.product.outcome == 'failure' || contains(join(steps.*.outputs.*, ' '), 'contract FAIL'))
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = ['site.log','product.log','behaviour.log']
              .filter(f => fs.existsSync(f)).map(f => `### ${f}\n\`\`\`\n${fs.readFileSync(f,'utf8').slice(-4000)}\n\`\`\``).join('\n');
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
              title: `evals: gate or safety failure on ${new Date().toISOString().slice(0,10)}`, body });
